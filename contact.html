<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact — ODDORA Games</title>

  <meta
    name="description"
    content="Contact ODDORA Games."
  >

  <link rel="stylesheet" href="styles.css">

  <style>
    .contact-page {
      width: min(800px, 90%);
      margin: 0 auto;
      padding: 100px 0;
      text-align: center;
    }

    .contact-page h1 {
      font-size: clamp(45px, 8vw, 80px);
      margin-bottom: 20px;
    }

    .contact-page p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 17px;
      max-width: 650px;
      margin: 0 auto 30px;
    }

    .contact-box {
      margin-top: 40px;
      padding: 35px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.04);
    }

    .contact-box strong {
      display: block;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .contact-box a {
      color: var(--accent2);
      text-decoration: none;
      font-weight: 700;
      word-break: break-word;
    }

    .back-button {
      display: inline-flex;
      margin-top: 40px;
      padding: 14px 22px;
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        var(--accent),
        #5944e6
      );
      color: white;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <header class="topbar">

    <a
      href="index.html"
      class="logo"
    >
      ODDORA
    </a>

    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="index.html#games">
        Games
      </a>

    </nav>

  </header>

  <main class="contact-page">

    <div class="eyebrow">
      ODDORA GAMES
    </div>

    <h1>
      Contact
    </h1>

    <p>
      Have a question, found a problem, or want to
      contact ODDORA Games? We would like to hear from you.
    </p>

    <div class="contact-box">

      <strong>
        Contact ODDORA
      </strong>

      <p>
        For questions, feedback, or support,
        please contact us by email.
      </p>

      <a href="mailto:ahmadmsoub130@gmail.com">
        ahmadmsoub130@gmail.com
      </a>

    </div>

    <a
      href="index.html"
      class="back-button"
    >
      BACK TO ODDORA
    </a>

  </main>

  <footer>

    <div class="footer-logo">
      ODDORA
    </div>

    <p>
      © 2026 ODDORA Games
    </p>

  </footer>

</body>
</html>
