<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ODDORA Games</title>

  <meta name="description" content="ODDORA Games - Play fast browser games, challenge yourself and save your scores.">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">

  <a href="#" class="logo">ODDORA</a>

  <nav>
    <a href="#games">Games</a>
    <a href="#leaderboard">Leaderboard</a>
    <button id="loginBtn">Sign In</button>
  </nav>

</header>


<main>

  <section class="hero">

    <div class="hero-content">

      <div class="eyebrow">
        ODDORA GAMES
      </div>

      <h1>
        PLAY.<br>
        COMPETE.<br>
        REPEAT.
      </h1>

      <p>
        Fast browser games built for mobile and desktop.
        Play challenges, collect scores and compete.
      </p>

      <a href="#games" class="hero-button">
        START PLAYING
      </a>

    </div>

  </section>


  <section id="games" class="section">

    <div class="section-header">

      <div>
        <div class="eyebrow">GAME ARCADE</div>

        <h2>
          Featured Games
        </h2>
      </div>

      <input
        id="search"
        type="text"
        placeholder="Search games..."
      >

    </div>


    <div id="gameGrid" class="game-grid"></div>

  </section>


  <section id="leaderboard" class="section">

    <div class="eyebrow">
      SCORES
    </div>

    <h2>
      Leaderboard
    </h2>

    <div
      id="leaderboardBox"
      class="leaderboard"
    ></div>

  </section>

</main>


<footer>

  <div class="footer-logo">
    ODDORA
  </div>

  <p>
    © 2026 ODDORA Games
  </p>

</footer>


<div
  id="gameModal"
  class="modal hidden"
>

  <div class="modal-box">

    <button
      id="closeModal"
      class="close"
    >
      ×
    </button>

    <div id="gameArea"></div>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
