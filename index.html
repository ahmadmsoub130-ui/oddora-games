<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ODDORA Games - خمسون لعبة عربية من الأسئلة والألغاز والقصص والتحديات">
<title>ODDORA Games</title>

<style>
:root{
 --bg:#060914;
 --bg2:#0d1324;
 --card:#111a2e;
 --card2:#151f35;
 --text:#f5f7ff;
 --muted:#9ca9c0;
 --primary:#785cff;
 --secondary:#20d9ff;
 --border:#273550;
 --good:#38e29a;
 --bad:#ff5d78;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
 margin:0;
 background:
 radial-gradient(circle at 10% 0%,rgba(120,92,255,.20),transparent 30%),
 radial-gradient(circle at 90% 10%,rgba(32,217,255,.12),transparent 30%),
 var(--bg);
 color:var(--text);
 font-family:Tahoma,Arial,sans-serif;
 min-height:100vh;
}

button,input{
 font:inherit;
}

button{
 cursor:pointer;
}

.container{
 width:min(1180px,92%);
 margin:auto;
}

header{
 position:sticky;
 top:0;
 z-index:100;
 background:rgba(6,9,20,.88);
 backdrop-filter:blur(15px);
 border-bottom:1px solid rgba(255,255,255,.07);
}

.nav{
 min-height:68px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
}

.logo{
 font-size:27px;
 font-weight:900;
 letter-spacing:2px;
 background:linear-gradient(90deg,#fff,#8a74ff,#22dfff);
 -webkit-background-clip:text;
 color:transparent;
}

.nav-actions{
 display:flex;
 gap:8px;
 align-items:center;
}

.btn{
 border:0;
 border-radius:13px;
 padding:11px 17px;
 color:#fff;
 font-weight:800;
 background:linear-gradient(135deg,var(--primary),#4c9dff);
 box-shadow:0 8px 25px rgba(120,92,255,.20);
}

.btn:hover{
 transform:translateY(-1px);
}

.btn.secondary{
 background:#151e32;
 border:1px solid var(--border);
 box-shadow:none;
}

.hero{
 padding:65px 0 35px;
 text-align:center;
}

.hero .tag{
 display:inline-block;
 padding:7px 14px;
 border:1px solid #33415f;
 background:#111a2d;
 border-radius:999px;
 color:#82eaff;
 font-size:13px;
 font-weight:800;
}

.hero h1{
 font-size:clamp(42px,8vw,78px);
 margin:18px 0 10px;
 line-height:1;
}

.gradient{
 background:linear-gradient(90deg,#fff,#8d76ff,#25dfff);
 -webkit-background-clip:text;
 color:transparent;
}

.hero p{
 max-width:700px;
 margin:0 auto;
 color:var(--muted);
 line-height:1.9;
 font-size:17px;
}

.hero-actions{
 margin-top:25px;
 display:flex;
 justify-content:center;
 gap:10px;
 flex-wrap:wrap;
}

.stats{
 display:flex;
 justify-content:center;
 gap:10px;
 flex-wrap:wrap;
 margin-top:25px;
}

.stat{
 padding:9px 15px;
 background:#10182b;
 border:1px solid var(--border);
 border-radius:999px;
 color:#ccd5e7;
}

.section{
 padding:25px 0 55px;
}

.section-title{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:15px;
 margin-bottom:18px;
}

.section-title h2{
 margin:0;
 font-size:30px;
}

.section-title p{
 margin:0;
 color:var(--muted);
}

.filters{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:5px 0 18px;
}

.filters button{
 white-space:nowrap;
}

.games{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px;
}

.game-card{
 background:linear-gradient(145deg,var(--card2),var(--card));
 border:1px solid var(--border);
 border-radius:19px;
 padding:17px;
 min-height:205px;
 display:flex;
 flex-direction:column;
 justify-content:space-between;
 transition:.2s;
}

.game-card:hover{
 transform:translateY(-3px);
 border-color:#4b5d84;
}

.game-icon{
 font-size:38px;
}

.game-card h3{
 margin:8px 0 5px;
}

.game-card p{
 color:var(--muted);
 font-size:13px;
 line-height:1.6;
 margin:0;
}

.game-category{
 color:#83eaff;
 font-size:11px;
 font-weight:bold;
 margin-top:7px;
}

.game-card .btn{
 width:100%;
 margin-top:13px;
}

#gameScreen{
 display:none;
}

.game-screen{
 background:#0b1220;
 border:1px solid var(--border);
 border-radius:24px;
 padding:25px;
 min-height:380px;
}

.game-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 border-bottom:1px solid var(--border);
 padding-bottom:15px;
 margin-bottom:20px;
}

.game-head h2{
 margin:0;
}

.game-content{
 max-width:800px;
 margin:auto;
 text-align:center;
}

.question{
 font-size:23px;
 font-weight:800;
 line-height:1.7;
 margin:20px 0;
}

.answers{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.answer{
 padding:15px;
 background:#131d32;
 color:#fff;
 border:1px solid var(--border);
 border-radius:13px;
 cursor:pointer;
 transition:.15s;
}

.answer:hover{
 border-color:#697da8;
 background:#18243d;
}

.answer.correct{
 background:rgba(56,226,154,.15);
 border-color:var(--good);
}

.answer.wrong{
 background:rgba(255,93,120,.15);
 border-color:var(--bad);
}

.result{
 min-height:28px;
 margin:15px 0;
 font-weight:bold;
}

.scorebox{
 display:inline-block;
 padding:9px 16px;
 background:#131d32;
 border:1px solid var(--border);
 border-radius:999px;
 margin-bottom:12px;
}

.story{
 font-size:19px;
 line-height:2;
 background:#10182a;
 border:1px solid var(--border);
 padding:20px;
 border-radius:17px;
}

.story button{
 margin:8px;
}

.timer{
 font-size:42px;
 font-weight:900;
 margin:20px;
 color:#8d7aff;
}

.big-action{
 width:170px;
 height:170px;
 border-radius:50%;
 border:0;
 color:white;
 font-weight:900;
 font-size:25px;
 background:radial-gradient(circle at 30% 25%,#fff,#8972ff 25%,#4d35d0 65%,#1a123e);
 box-shadow:0 15px 50px rgba(100,75,255,.3);
}

.riddle-box{
 padding:25px;
 border-radius:18px;
 background:#10182b;
 border:1px solid var(--border);
}

.text-input{
 width:100%;
 max-width:500px;
 padding:14px;
 background:#080d17;
 border:1px solid var(--border);
 color:#fff;
 border-radius:12px;
 outline:none;
 margin:10px 0;
}

.profile{
 display:flex;
 align-items:center;
 gap:8px;
}

.avatar{
 width:40px;
 height:40px;
 display:grid;
 place-items:center;
 border-radius:50%;
 background:linear-gradient(135deg,var(--primary),var(--secondary));
 font-weight:900;
}

footer{
 border-top:1px solid rgba(255,255,255,.07);
 padding:30px 0;
 text-align:center;
 color:var(--muted);
 font-size:13px;
}

.modal{
 position:fixed;
 inset:0;
 display:none;
 place-items:center;
 padding:18px;
 background:rgba(0,0,0,.75);
 backdrop-filter:blur(8px);
 z-index:200;
}

.modal.show{
 display:grid;
}

.modal-box{
 width:min(430px,100%);
 background:#0d1424;
 border:1px solid var(--border);
 border-radius:22px;
 padding:24px;
}

.close{
 float:left;
 border:0;
 background:none;
 color:#aaa;
 font-size:25px;
}

label{
 display:block;
 color:var(--muted);
 font-size:13px;
 margin:12px 0 6px;
}

input{
 width:100%;
 padding:13px;
 background:#080d17;
 border:1px solid var(--border);
 color:#fff;
 border-radius:11px;
 outline:none;
}

.auth-message{
 min-height:22px;
 color:#ffd36b;
 font-size:13px;
 margin:10px 0;
}

@media(max-width:900px){
 .games{
  grid-template-columns:repeat(2,1fr);
 }
}

@media(max-width:600px){
 .nav{
  min-height:60px;
 }
 .nav-actions .secondary{
  display:none;
 }
 .hero{
  padding-top:45px;
 }
 .games{
  grid-template-columns:1fr;
 }
 .answers{
  grid-template-columns:1fr;
 }
 .game-screen{
  padding:17px;
 }
 .question{
  font-size:19px;
 }
}
</style>
</head>

<div class="hero-actions">

</section>

</div>
</div>

<div class="filters">

<button class="btn secondary" onclick="filterGames('أسئلة')">أسئلة</button>
<button class="btn secondary" onclick="filterGames('ألغاز')">ألغاز</button>

<div class="games" id="gamesGrid"></div>

</section>

<section class="container section" id="gameScreen">

</div>

<div class="game-content" id="gameContent"></div>

</div>

</section>

</main>

<footer>
<div class="container">
© <span id="year"></span> ODDORA Games — ألعاب عربية
</div>
</footer>

<div class="modal" id="authModal">

<div class="modal-box">

<button class="close" onclick="closeAuth()">×</button>

<h2 id="authTitle">تسجيل الدخول</h2>

<div style="display:flex;gap:8px;margin-bottom:15px">
<button class="btn" style="flex:1" onclick="setAuthMode('login')">دخول</button>
<button class="btn secondary" style="flex:1" onclick="setAuthMode('signup')">حساب جديد</button>
</div>

<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="example@email.com">

<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور">

<div class="auth-message" id="authMessage"></div>

<button class="btn" style="width:100%" onclick="submitAuth()">متابعة</button>

</div>

</div>

/* =========================
   عرض الألعاب
========================= */

const grid=document.getElementById("gamesGrid");

function renderGames(list=games){

 grid.innerHTML="";

 list.forEach(game=>{

  const card=document.createElement("article");

  card.className="game-card";

  card.innerHTML=`
   <div>
    <div class="game-icon">${game.icon}</div>
    <h3>${game.title}</h3>
    <p>${descriptionFor(game)}</p>
    <div class="game-category">${game.category}</div>
   </div>

   <button class="btn" onclick="openGame(${game.id})">
   العب الآن
   </button>
  `;

  grid.appendChild(card);

 });

}

function descriptionFor(game){

 if(game.type==="quiz")
 return "أجب عن الأسئلة واحصل على النقاط.";

 if(game.type==="riddle")
 return "حل الألغاز واكتشف الإجابة الصحيحة.";

 if(game.type==="story")
 return "اختر قراراتك وشاهد كيف تتغير الحكاية.";

 return "اختبر سرعتك وحاول تحطيم رقمك القياسي.";

}

function filterGames(category){

 if(category==="الكل"){
  renderGames(games);
 }else{
  renderGames(games.filter(g=>g.category===category));
 }

 goGames();

}

renderGames();


/* =========================
   تشغيل اللعبة
========================= */

let currentGame=null;

function openGame(id){

 currentGame=games.find(g=>g.id===id);

 if(!currentGame)return;

 document.getElementById("gamesSection").style.display="none";
 document.getElementById("gameScreen").style.display="block";

 document.getElementById("activeGameTitle").textContent=
 currentGame.icon+" "+currentGame.title;

 if(currentGame.type==="quiz")
 startQuiz();

 else if(currentGame.type==="riddle")
 startRiddle();

 else if(currentGame.type==="story")
 startStory();

 else
 startTap();

 window.scrollTo({
  top:document.getElementById("gameScreen").offsetTop-75,
  behavior:"smooth"
 });

}

function closeGame(){

 document.getElementById("gameScreen").style.display="none";
 document.getElementById("gamesSection").style.display="block";

 goGames();

}

function goGames(){

 document.getElementById("gamesSection").scrollIntoView({
  behavior:"smooth"
 });

}

let quizIndex=0;
let quizQuestions=[];

function startQuiz(){

 quizQuestions=[...currentGame.questions];

 quizIndex=0;
 gameScore=0;

 showQuizQuestion();

}

function showQuizQuestion(){

 const content=document.getElementById("gameContent");

 if(quizIndex>=quizQuestions.length){

  content.innerHTML=`
   <div class="scorebox">
   نتيجتك: ${gameScore}
   </div>

   <h2>انتهى الاختبار!</h2>

   <p>
   أحسنت. يمكنك إعادة اللعب وتحسين نتيجتك.
   </p>

   <button class="btn" onclick="startQuiz()">
   إعادة اللعب
   </button>

   <button class="btn secondary" onclick="closeGame()">
   ألعاب أخرى
   </button>
  `;

  saveScore(currentGame.id,gameScore);

  return;
 }

 const q=quizQuestions[quizIndex];

 let answers="";

 q[1].forEach((answer,index)=>{

  answers+=`
   <button class="answer"
   onclick="answerQuiz(${index})">
   ${answer}
   </button>
  `;

 });

 content.innerHTML=`

  <div class="scorebox">
  السؤال ${quizIndex+1} من ${quizQuestions.length}
  </div>

  <div class="scorebox">
  النقاط: ${gameScore}
  </div>

  <div class="question">
  ${q[0]}
  </div>

  <div class="answers">
  ${answers}
  </div>

  <div class="result" id="quizResult"></div>

 `;

}

function answerQuiz(index){

 const q=quizQuestions[quizIndex];

 const buttons=document.querySelectorAll(".answer");

 buttons.forEach((b,i)=>{

  b.disabled=true;

  if(i===q[2])
   b.classList.add("correct");

 });

 const result=document.getElementById("quizResult");

 if(index===q[2]){

  gameScore+=10;

  result.textContent="إجابة صحيحة +10 نقاط";

 }else{

  buttons[index].classList.add("wrong");

  result.textContent="إجابة غير صحيحة";

 }

 setTimeout(()=>{

  quizIndex++;
  showQuizQuestion();

 },900);

}

function normalizeText(text){

 return text
 .toLowerCase()
 .trim()
 .replace(/[أإآ]/g,"ا")
 .replace(/ة/g,"ه")
 .replace(/ى/g,"ي")
 .replace(/\s+/g,"");

}

function checkRiddle(){

 const input=document.getElementById("riddleAnswer");

 const answer=normalizeText(input.value);

 const correct=normalizeText(
 currentGame.questions[riddleIndex][1]
 );

 const result=document.getElementById("riddleResult");

 if(answer && (answer===correct || correct.includes(answer) || answer.includes(correct))){

  gameScore+=15;

  result.textContent="صحيح! +15 نقاط";

  setTimeout(()=>{

   riddleIndex++;
   showRiddle();

  },900);

 }else{

  result.textContent="ليست الإجابة الصحيحة، حاول مرة أخرى.";

 }

}

function beginTap(){

 if(tapRunning)return;

 tapRunning=true;
 tapTime=10;
 tapScore=0;

 document.getElementById("tapScore").textContent=0;
 document.getElementById("tapTimer").textContent=10;

 clearInterval(tapTimer);

 tapTimer=setInterval(()=>{

  tapTime--;

  document.getElementById("tapTimer").textContent=tapTime;

  if(tapTime<=0){

   clearInterval(tapTimer);

   tapRunning=false;

   saveScore(currentGame.id,tapScore);

   alert("انتهى الوقت! نتيجتك: "+tapScore);

  }

 },1000);

}

function tapClick(){

 if(!tapRunning)return;

 tapScore++;

 document.getElementById("tapScore").textContent=tapScore;

}


/* =========================
   حفظ النتيجة
========================= */

async function saveScore(gameId,score){

 const key="oddora_best_"+gameId;

 const old=Number(localStorage.getItem(key)||0);

 if(score>old){

  localStorage.setItem(key,score);

 }

 try{

  const {data:{user}}=
  await supabaseClient.auth.getUser();

  if(user){

   const oldUserScore=
   Number(user.user_metadata?.["game_"+gameId]||0);

   if(score>oldUserScore){

    await supabaseClient.auth.updateUser({

     data:{
      ["game_"+gameId]:score
     }

    });

   }

  }

 }catch(e){

  console.log(e);

 }

}


/* =========================
   تسجيل الدخول
========================= */

let authMode="login";

function openAuth(){

 document.getElementById("authModal").classList.add("show");

}

function closeAuth(){

 document.getElementById("authModal").classList.remove("show");

 document.getElementById("authMessage").textContent="";

}

function setAuthMode(mode){

 authMode=mode;

 document.getElementById("authTitle").textContent=
 mode==="login" ? "تسجيل الدخول" : "إنشاء حساب جديد";

 document.getElementById("authMessage").textContent="";

}

async function submitAuth(){

 const email=
 document.getElementById("email").value.trim();

 const password=
 document.getElementById("password").value;

 const msg=
 document.getElementById("authMessage");

 if(!email || !password){

  msg.textContent="أدخل البريد الإلكتروني وكلمة المرور.";

  return;

 }

 msg.textContent="جاري التنفيذ...";

 try{

  if(authMode==="signup"){

   const {data,error}=
   await supabaseClient.auth.signUp({
    email,
    password
   });

   if(error)throw error;

   if(data.session){

    msg.textContent="تم إنشاء الحساب وتسجيل الدخول.";

    setTimeout(closeAuth,700);

   }else{

    msg.textContent=
    "تم إنشاء الحساب. إذا كان تأكيد البريد مفعّلًا، افحص بريدك الإلكتروني.";

   }

  }else{

   const {error}=
   await supabaseClient.auth.signInWithPassword({
    email,
    password
   });

   if(error)throw error;

   closeAuth();

  }

 }catch(error){

  msg.textContent=
  error.message || "حدث خطأ أثناء العملية.";

 }

}

    </div>

    <button
    class="btn secondary"
    onclick="logout()">
    خروج
    </button>

   </div>

  `;

 }else{

  area.innerHTML=`
   <button class="btn" onclick="openAuth()">
   دخول / تسجيل
   </button>
  `;

 }

}

async function logout(){

 await supabaseClient.auth.signOut();

}

supabaseClient.auth.onAuthStateChange(
(event,session)=>{

 updateAuthUI(session?.user||null);

}
);

supabaseClient.auth.getSession()
.then(({data})=>{

 updateAuthUI(data.session?.user||null);

});

========================= */

document.getElementById("year").textContent=
new Date().getFullYear();

</script>
