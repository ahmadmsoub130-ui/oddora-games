<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ODDORA Games — Play. Compete. Repeat.</title>

  <meta
    name="description"
    content="ODDORA Games — fast, fun browser games for mobile and desktop."
  >

  <meta name="theme-color" content="#060711">
  <meta name="robots" content="index, follow">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">

  <a
    href="#top"
    class="logo"
    aria-label="ODDORA Games home"
  >
    ODDORA
  </a>

  <nav aria-label="Main navigation">

    <a href="#games">
      Games
    </a>

    <a href="#leaderboard">
      Leaderboard
    </a>

    <button
      id="loginBtn"
      type="button"
    >
      SIGN IN
    </button>

  </nav>

</header>


<main id="top">

  <!-- HERO -->

  <section class="hero">

    <div class="hero-content">

      <div class="eyebrow">
        ODDORA GAMES
      </div>

      <h1>
        PLAY.<br>
        COMPETE.<br>
        REPEAT.
      </h1>

      <p>
        Fast browser games built for mobile and desktop.
        Play challenges, collect scores and compete.
      </p>

      <a
        href="#games"
        class="hero-button"
      >
        START PLAYING
      </a>

    </div>

  </section>


  <!-- GAMES -->

  <section
    id="games"
    class="section"
  >

    <div class="section-header">

      <div>

        <div class="eyebrow">
          GAME ARCADE
        </div>

        <h2>
          Featured Games
        </h2>

      </div>

      <input
        id="search"
        type="search"
        placeholder="Search games..."
        autocomplete="off"
        aria-label="Search games"
      >

    </div>

    <div
      id="gameGrid"
      class="game-grid"
    ></div>

  </section>


  <!-- LEADERBOARD -->

  <section
    id="leaderboard"
    class="section"
  >

    <div class="eyebrow">
      SCORES
    </div>

    <h2>
      Leaderboard
    </h2>

    <div
      id="leaderboardBox"
      class="leaderboard"
      aria-live="polite"
    ></div>

  </section>

</main>


<!-- FOOTER -->

<footer>

  <div class="footer-logo">
    ODDORA
  </div>

  <p>
    © 2026 ODDORA Games
  </p>

  <div
    class="footer-links"
    style="
      margin-top: 15px;
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    "
  >

    <a
      href="privacy.html"
      style="
        color: #9da4bd;
        text-decoration: none;
      "
    >
      Privacy Policy
    </a>

    <a
      href="terms.html"
      style="
        color: #9da4bd;
        text-decoration: none;
      "
    >
      Terms of Service
    </a>

    <a
      href="contact.html"
      style="
        color: #9da4bd;
        text-decoration: none;
      "
    >
      Contact
    </a>

  </div>

</footer>


<!-- GAME MODAL -->

<div
  id="gameModal"
  class="modal hidden"
  role="dialog"
  aria-modal="true"
  aria-label="Game window"
>

  <div class="modal-box">

    <button
      id="closeModal"
      class="close"
      type="button"
      aria-label="Close"
    >
      ×
    </button>

    <div
      id="gameArea"
    ></div>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ODDORA APP -->

<script src="app.js"></script>

</body>
</html>
